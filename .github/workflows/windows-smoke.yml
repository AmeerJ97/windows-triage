name: windows-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/windows-smoke-ci.ps1"
      - ".github/workflows/windows-smoke.yml"

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Windows smoke
        shell: pwsh
        run: .\scripts\windows-smoke-ci.ps1
