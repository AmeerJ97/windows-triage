---
name: stale-triage
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  mark-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark inactive conversations for review
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 90
          days-before-issue-close: -1
          days-before-pr-stale: 60
          days-before-pr-close: -1
          stale-issue-label: status/stale
          stale-pr-label: status/stale
          exempt-issue-labels: pinned,security,roadmap,status/in-progress,help wanted,good first issue
          exempt-pr-labels: pinned,security,status/in-progress,dependencies
          stale-issue-message: >-
            This issue has been inactive for 90 days and is marked for maintainer
            review. It will not be closed automatically. A new relevant comment will
            remove the stale label.
          stale-pr-message: >-
            This pull request has been inactive for 60 days and is marked for
            maintainer review. It will not be closed automatically. Push a change or
            leave a relevant comment to remove the stale label.
          remove-stale-when-updated: true
          operations-per-run: 100
