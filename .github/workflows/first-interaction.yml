---
name: welcome
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        continue-on-error: true
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d  # v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >-
            Thanks for opening your first Windows Triage issue. Please avoid attaching
            full diagnostic ZIP files publicly; `public_summary.md` is the intended
            public artifact. A maintainer will review this when available.
          pr-message: >-
            Thanks for your first contribution to Windows Triage. Please make sure the
            PR explains user-visible behavior, privacy impact, and verification. The
            automated checks will run shortly.
