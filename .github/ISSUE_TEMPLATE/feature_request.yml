name: Feature request
description: Suggest an improvement to Windows Triage
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem or maintainer problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy or security impact
      description: Explain whether this changes collected data, report contents, or trust assumptions.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
